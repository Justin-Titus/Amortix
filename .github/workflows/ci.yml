name: Web CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Type Check, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: AmortixWeb/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: AmortixWeb
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: AmortixWeb
        run: pnpm exec prisma generate

      - name: TypeScript type check
        working-directory: AmortixWeb
        run: pnpm exec tsc --noEmit

      - name: ESLint
        working-directory: AmortixWeb
        run: pnpm lint

      - name: Vitest unit tests
        working-directory: AmortixWeb
        run: pnpm test

  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    # Only run E2E on PRs and pushes to main to save CI minutes
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: AmortixWeb/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: AmortixWeb
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: AmortixWeb
        run: pnpm exec playwright install chromium --with-deps

      - name: Generate Prisma client
        working-directory: AmortixWeb
        run: pnpm exec prisma generate

      - name: Create .env for build
        working-directory: AmortixWeb
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "NEXT_PUBLIC_APP_URL=http://localhost:3000" >> .env
          echo "CRON_SECRET=ci_test_secret" >> .env

      - name: Run Playwright smoke tests
        working-directory: AmortixWeb
        run: pnpm test:e2e:ci
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: AmortixWeb/playwright-report/
          retention-days: 7
