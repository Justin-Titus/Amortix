name: Web CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Type Check, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: ESLint
        run: pnpm lint

      - name: Vitest unit tests
        run: pnpm test

  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    # Only run E2E on PRs and pushes to main to save CI minutes
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Create .env for build
        run: |
          DATABASE_URL="${{ secrets.DATABASE_URL }}"
          if [ -z "$DATABASE_URL" ]; then
            DATABASE_URL="postgresql://postgres:postgres@localhost:5432/postgres"
          fi
          
          SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
          if [ -z "$SUPABASE_URL" ]; then
            SUPABASE_URL="https://mock.supabase.co"
          fi
          
          SUPABASE_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
          if [ -z "$SUPABASE_KEY" ]; then
            SUPABASE_KEY="mock-anon-key"
          fi

          echo "DATABASE_URL=$DATABASE_URL" >> .env
          echo "NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL" >> .env
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_KEY" >> .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY || 'mock-groq-key' }}" >> .env
          echo "NEXT_PUBLIC_APP_URL=http://localhost:3000" >> .env
          echo "CRON_SECRET=ci_test_secret" >> .env

      - name: Build Next.js app
        run: pnpm build

      - name: Run Playwright smoke tests
        run: pnpm test:e2e:ci
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
